<!-- =======================================================================
     COMPONENT: BADGES & STATUS LABELS (Tokens-Only, WCAG AA Compliant)
     No hardcoded hex codes. Monoline Lucide SVGs only.
     ======================================================================= -->

<div class="card-ledger p-6 bg-[var(--bg-surface)] space-y-6 max-w-lg">

  <!-- 1. Verified Identity Badges -->
  <div>
    <h3 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">1. Verification Badges</h3>
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Standard Verified Badge -->
      <span class="badge-verified">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Verified Identity</span>
      </span>

      <!-- Dark Overlay Variant -->
      <span class="badge-verified bg-black/75 text-white border-white/20">
        <svg class="w-3.5 h-3.5 text-[var(--accent-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <span>100% ID KYC</span>
      </span>
    </div>
  </div>

  <!-- 2. Interest Inbox & Workflow Status Badges -->
  <div>
    <h3 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">2. Workflow Status Labels</h3>
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Pending Status -->
      <span class="badge-status text-[var(--secondary-text)] bg-[var(--secondary-subtle)] border border-[var(--secondary-border)]">
        <svg class="w-3 h-3 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
        <span>Pending</span>
      </span>

      <!-- Accepted / Confirmed Status -->
      <span class="badge-status text-[var(--color-success)] bg-[var(--color-success-bg)] border border-[var(--color-success-border)]">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Accepted</span>
      </span>

      <!-- Declined / Withdrawn Status -->
      <span class="badge-status text-[var(--color-danger)] bg-[var(--color-danger-bg)] border border-[var(--color-danger-border)]">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Declined</span>
      </span>

      <!-- Informational / Chaperoned Status -->
      <span class="badge-status text-[var(--color-info)] bg-[var(--color-info-bg)] border border-[var(--color-info-border)]">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Awaiting Guardian Review</span>
      </span>

      <!-- Neutral / Archival Status -->
      <span class="badge-status text-[var(--text-muted)] bg-[var(--bg-subtle)] border border-[var(--border-default)]">
        <span>Archived</span>
      </span>
    </div>
  </div>

  <!-- 3. Membership & Account Tier Badges -->
  <div>
    <h3 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">3. Membership Tier</h3>
    <div class="flex items-center gap-2 flex-wrap">
      <span class="px-2.5 py-0.5 rounded-[var(--radius-sm)] text-[10px] font-bold uppercase tracking-wider bg-[var(--secondary-subtle)] text-[var(--secondary-text)] border border-[var(--secondary-border)]">
        Single Pass Active
      </span>
      <span class="px-2.5 py-0.5 rounded-[var(--radius-sm)] text-[10px] font-bold uppercase tracking-wider bg-[var(--bg-subtle)] text-[var(--text-secondary)] border border-[var(--border-default)]">
        Free Member
      </span>
    </div>
  </div>

  <!-- 4. Counter Badges (Unread messages, notifications) -->
  <div>
    <h3 class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">4. Counter Indicators</h3>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-[var(--accent-primary)] text-white text-[10px] font-bold">
        3
      </span>
      <span class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-[var(--color-danger)] text-white text-[10px] font-bold">
        99+
      </span>
    </div>
  </div>

</div>
