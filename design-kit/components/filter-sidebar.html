<!-- =======================================================================
     COMPONENT: SEARCH & FILTER SIDEBAR + MOBILE BOTTOM SHEET
     Desktop: sticky left sidebar with collapsible groups.
     Mobile: slide-up bottom drawer.
     Active filter chips & 1-click Reset button.
     ======================================================================= -->

<div x-data="{ mobileFilterOpen: false }" class="relative">

  <!-- =====================================================================
       ACTIVE FILTER CHIPS BAR (Visible above discovery lists)
       ===================================================================== -->
  <div class="card-ledger p-3 bg-[var(--bg-surface)] flex flex-wrap items-center justify-between gap-3 mb-6">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-xs font-bold text-[var(--text-secondary)]">Active Filters:</span>

      <!-- Sample Filter Chip 1 -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[var(--radius-sm)] bg-[var(--accent-subtle)] text-[var(--accent-text)] border border-[var(--accent-border)] text-xs font-medium">
        <span>Bride (Female)</span>
        <button type="button" class="hover:text-[var(--text-primary)] cursor-pointer" aria-label="Remove Bride filter">&times;</button>
      </span>

      <!-- Sample Filter Chip 2 -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[var(--radius-sm)] bg-[var(--accent-subtle)] text-[var(--accent-text)] border border-[var(--accent-border)] text-xs font-medium">
        <span>Age: 22 - 30</span>
        <button type="button" class="hover:text-[var(--text-primary)] cursor-pointer" aria-label="Remove Age filter">&times;</button>
      </span>

      <!-- Sample Filter Chip 3 -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[var(--radius-sm)] bg-[var(--accent-subtle)] text-[var(--accent-text)] border border-[var(--accent-border)] text-xs font-medium">
        <span>Dhaka</span>
        <button type="button" class="hover:text-[var(--text-primary)] cursor-pointer" aria-label="Remove City filter">&times;</button>
      </span>
    </div>

    <!-- Reset All Button -->
    <a href="#" class="btn-subtle text-xs text-[var(--color-danger)] hover:underline">
      <span>Reset all filters</span>
    </a>
  </div>

  <!-- Mobile Filter Drawer Toggle Button (Hidden on Desktop) -->
  <div class="lg:hidden mb-4">
    <button type="button"
            @click="mobileFilterOpen = true"
            class="btn-secondary w-full justify-between text-xs font-bold">
      <span class="flex items-center gap-2">
        <svg class="w-4 h-4 text-[var(--accent-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        <span>Filter Directory (3 Active)</span>
      </span>
      <span>&darr;</span>
    </button>
  </div>

  <!-- =====================================================================
       1. DESKTOP STICKY LEFT FILTER SIDEBAR (Visible lg+)
       ===================================================================== -->
  <aside class="hidden lg:block w-72 shrink-0">
    <div class="card-ledger p-5 bg-[var(--bg-surface)] sticky top-20 space-y-5">
      <div class="flex items-center justify-between border-b border-[var(--border-subtle)] pb-3">
        <h2 class="text-xs font-bold text-[var(--text-primary)] uppercase tracking-wider flex items-center gap-2">
          <svg class="w-4 h-4 text-[var(--accent-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span>Filter Candidates</span>
        </h2>
        <a href="#" class="text-[11px] font-semibold text-[var(--text-muted)] hover:text-[var(--color-danger)]">Reset</a>
      </div>

      <form action="#" method="GET" class="space-y-4">
        <!-- Collapsible Group 1: Candidate Gender & Intent -->
        <div x-data="{ open: true }" class="border-b border-[var(--border-subtle)] pb-3">
          <button type="button" @click="open = !open" class="w-full flex items-center justify-between text-xs font-bold text-[var(--text-primary)]">
            <span>Looking For</span>
            <span class="text-xs text-[var(--text-muted)]" x-text="open ? '−' : '+'"></span>
          </button>
          <div x-show="open" class="mt-2.5 space-y-1.5">
            <label class="flex items-center gap-2 text-xs text-[var(--text-secondary)] cursor-pointer">
              <input type="radio" name="gender" value="female" class="text-[var(--accent-primary)] focus:ring-[var(--accent-primary)]" checked />
              <span>Practicing Bride (Female)</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-[var(--text-secondary)] cursor-pointer">
              <input type="radio" name="gender" value="male" class="text-[var(--accent-primary)] focus:ring-[var(--accent-primary)]" />
              <span>Practicing Groom (Male)</span>
            </label>
          </div>
        </div>

        <!-- Collapsible Group 2: Age Range -->
        <div x-data="{ open: true }" class="border-b border-[var(--border-subtle)] pb-3">
          <button type="button" @click="open = !open" class="w-full flex items-center justify-between text-xs font-bold text-[var(--text-primary)]">
            <span>Age Range</span>
            <span class="text-xs text-[var(--text-muted)]" x-text="open ? '−' : '+'"></span>
          </button>
          <div x-show="open" class="mt-2.5 grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-[var(--text-muted)] uppercase font-semibold">Min</label>
              <input type="number" min="18" max="75" placeholder="21" class="w-full h-9 px-2.5 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none focus:ring-1 focus:ring-[var(--accent-primary)]" />
            </div>
            <div>
              <label class="block text-[10px] text-[var(--text-muted)] uppercase font-semibold">Max</label>
              <input type="number" min="18" max="75" placeholder="35" class="w-full h-9 px-2.5 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none focus:ring-1 focus:ring-[var(--accent-primary)]" />
            </div>
          </div>
        </div>

        <!-- Collapsible Group 3: Location / District -->
        <div x-data="{ open: true }" class="border-b border-[var(--border-subtle)] pb-3">
          <button type="button" @click="open = !open" class="w-full flex items-center justify-between text-xs font-bold text-[var(--text-primary)]">
            <span>District / Location</span>
            <span class="text-xs text-[var(--text-muted)]" x-text="open ? '−' : '+'"></span>
          </button>
          <div x-show="open" class="mt-2.5">
            <input type="text" placeholder="e.g. Dhaka, Chittagong, London" class="w-full h-9 px-2.5 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none focus:ring-1 focus:ring-[var(--accent-primary)]" />
          </div>
        </div>

        <!-- Collapsible Group 4: Verification & Trust Toggles -->
        <div x-data="{ open: true }" class="border-b border-[var(--border-subtle)] pb-3">
          <button type="button" @click="open = !open" class="w-full flex items-center justify-between text-xs font-bold text-[var(--text-primary)]">
            <span>Trust &amp; Verification</span>
            <span class="text-xs text-[var(--text-muted)]" x-text="open ? '−' : '+'"></span>
          </button>
          <div x-show="open" class="mt-2.5 space-y-2">
            <label class="flex items-center gap-2 text-xs text-[var(--text-secondary)] cursor-pointer">
              <input type="checkbox" name="verified_only" class="rounded-[var(--radius-xs)] border-[var(--border-default)] text-[var(--accent-primary)] focus:ring-[var(--accent-primary)]" />
              <span>Verified ID Only</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-[var(--text-secondary)] cursor-pointer">
              <input type="checkbox" name="wali_required" class="rounded-[var(--radius-xs)] border-[var(--border-default)] text-[var(--accent-primary)] focus:ring-[var(--accent-primary)]" />
              <span>Guardian (Wali) Chaperoned</span>
            </label>
          </div>
        </div>

        <!-- Filter Apply Button -->
        <button type="submit" class="btn-primary w-full text-xs font-bold">
          <span>Apply Filters</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- =====================================================================
       2. MOBILE BOTTOM SHEET / SLIDING DRAWER (Visible when open)
       ===================================================================== -->
  <div x-show="mobileFilterOpen"
       x-cloak
       class="fixed inset-0 z-50 lg:hidden flex flex-col justify-end"
       role="dialog"
       aria-modal="true">
    <!-- Backdrop Overlay -->
    <div x-show="mobileFilterOpen"
         @click="mobileFilterOpen = false"
         class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity"></div>

    <!-- Sliding Sheet Container -->
    <div x-show="mobileFilterOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full"
         class="relative z-10 w-full max-h-[85vh] bg-[var(--bg-surface)] rounded-t-2xl border-t border-[var(--border-default)] flex flex-col shadow-2xl">
      <!-- Sheet Header with Grab Handle & Close -->
      <div class="p-4 border-b border-[var(--border-subtle)] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-1 rounded-full bg-[var(--neutral-400)] mr-2"></div>
          <h2 class="text-sm font-bold text-[var(--text-primary)]">Filter Directory</h2>
        </div>
        <button type="button" @click="mobileFilterOpen = false" class="p-1 text-[var(--text-muted)] hover:text-[var(--text-primary)] text-lg leading-none" aria-label="Close filters">&times;</button>
      </div>

      <!-- Sheet Scrollable Form Body -->
      <div class="p-4 overflow-y-auto space-y-4">
        <!-- Replicated Form Controls -->
        <div>
          <label class="block text-xs font-semibold text-[var(--text-secondary)] mb-1">Looking for</label>
          <select class="w-full h-10 px-3 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none">
            <option value="female">Practicing Bride (Female)</option>
            <option value="male">Practicing Groom (Male)</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-[var(--text-secondary)] mb-1">Age from</label>
            <input type="number" placeholder="21" class="w-full h-10 px-3 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[var(--text-secondary)] mb-1">Age to</label>
            <input type="number" placeholder="35" class="w-full h-10 px-3 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[var(--text-secondary)] mb-1">Location / District</label>
          <input type="text" placeholder="e.g. Dhaka, London" class="w-full h-10 px-3 rounded-[var(--radius-sm)] border border-[var(--border-default)] bg-[var(--bg-surface)] text-xs text-[var(--text-primary)] outline-none" />
        </div>
      </div>

      <!-- Sheet Fixed Action Footer -->
      <div class="p-4 border-t border-[var(--border-subtle)] flex items-center gap-3 bg-[var(--bg-surface)]">
        <button type="button" @click="mobileFilterOpen = false" class="btn-secondary flex-1 text-xs">Reset</button>
        <button type="button" @click="mobileFilterOpen = false" class="btn-primary flex-1 text-xs font-bold">Apply Filters</button>
      </div>
    </div>
  </div>

</div>
